# Writes package-lock.json for package.json on a runner (the lockfile artifact) and checks that the
# Expo SDK versions agree (expo install --check). Run by hand after a dependency change made
# without a local npm.
name: lockfile

on:
  workflow_dispatch:

permissions: {}

jobs:
  lockfile:
    name: lockfile
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js (version from .nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Resolve the dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Expo SDK versions agree
        run: npx expo install --check

      - name: Keep the lockfile
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lockfile
          path: |
            package.json
            package-lock.json
          if-no-files-found: error
          retention-days: 3
